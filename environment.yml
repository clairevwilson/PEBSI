name: gpu-env
channels:
  - conda-forge
dependencies:
  - python=3.11
  - cuda-version=12.9
  - jaxlib=*=cuda129*
  - jax
  - optax
  - numpy<2
  - pandas
  - xarray
  - rioxarray
  - geopandas
  - pysolar
  - pytz
  - shapely
  - rasterio
  - netcdf4
  - zarr<3
  - dask
  - jupyter
  - joblib
  - scipy
  - matplotlib
  - tqdm
  - pytest
  - equinox