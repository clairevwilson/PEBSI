# 2x2 grid search on kp and wind_factor at Gulkana site B.
# Run: python simulation.py -cf config_gridsearch_sample.yaml

output_fp: '../Output/gridsearch_sample/'
start_date: '2024-04-20 00:00'
end_date: '2024-09-30 23:00'

